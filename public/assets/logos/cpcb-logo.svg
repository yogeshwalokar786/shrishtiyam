<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="280" height="180">
  <defs>
    <linearGradient id="cpcbEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cpcbLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <g transform="translate(140, 68)">
    <circle cx="0" cy="0" r="54" fill="#f0fdf4" stroke="#059669" stroke-width="3" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="48" fill="#ffffff" stroke="#dcfce7" stroke-width="1" />
    
    <!-- Stylized Water Waves & Environmental Flow in Green -->
    <path d="M-36 12 Q-18 -2 0 12 T36 12" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <path d="M-36 22 Q-18 8 0 22 T36 22" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <path d="M-28 32 Q-14 22 0 32 T28 32" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

    <!-- Stylized Sustainable Tree / Arrow Leaf -->
    <path d="M0 -34 L-16 -12 L-6 -12 L-12 2 L0 -6 L12 2 L6 -12 L16 -12 Z" fill="url(#cpcbLeaf)" />
    <rect x="-2" y="-6" width="4" height="12" fill="#047857" rx="1" />
  </g>

  <!-- Bold CPCB Typography in Emerald -->
  <text x="140" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="3">CPCB</text>
  <text x="140" y="165" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">CENTRAL POLLUTION CONTROL BOARD</text>
</svg>
